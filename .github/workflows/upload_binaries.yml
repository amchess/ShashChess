name: Upload Binaries
on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
      release_tag:
        type: string
        required: false
      release_prerelease:
        type: boolean
        required: false
    secrets:
      token:
        required: true

jobs:
  Artifacts:
    name: ${{ matrix.config.name }} ${{ matrix.binaries }}
    runs-on: ubuntu-latest
    env:
      EXT: ${{ matrix.config.ext }}
      NAME: ${{ matrix.config.simple_name }}
      BINARY: ${{ matrix.binaries }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download artifact from compilation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.config.simple_name }} ${{ matrix.binaries }}
          path: ${{ matrix.config.simple_name }} ${{ matrix.binaries }}

      - name: Create Package
        run: |
          mkdir shashchess

      - name: Download wiki
        run: |
          git clone https://github.com/amchess/ShashChess.wiki.git wiki
          rm -rf wiki/.git
          mv wiki shashchess/

      - name: Copy files
        run: |
          mv "${{ matrix.config.simple_name }} ${{ matrix.binaries }}" shashchess-workflow
          cd shashchess-workflow
          cp -r src ../shashchess/
          cp -r scripts ../shashchess/
          cp shashchess-$NAME-$BINARY$EXT ../shashchess/
          cp "Top CPU Contributors.txt" ../shashchess/
          cp Copying.txt ../shashchess/
          cp AUTHORS ../shashchess/
          cp CITATION.cff ../shashchess/
          cp README.md ../shashchess/
          cp CONTRIBUTING.md ../shashchess/

      - name: Create tar
        if: ${{ startsWith(matrix.config.archive_ext, 'tar') }}
        run: |
          chmod +x ./shashchess/shashchess-$NAME-$BINARY$EXT
          tar -cavf shashchess-$NAME-$BINARY."${{ matrix.config.archive_ext }}" shashchess

      - name: Create zip
        if: ${{ matrix.config.archive_ext == 'zip' }}
        run: |
          zip -r shashchess-$NAME-$BINARY.zip shashchess

      - name: Upload Draft Release Asset
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
        with:
          tag_name: ${{ inputs.release_tag }}
          draft: true
          prerelease: ${{ inputs.release_prerelease }}
          files: shashchess-${{ matrix.config.simple_name }}-${{ matrix.binaries }}.${{ matrix.config.archive_ext }}
          token: ${{ secrets.token }}
